name: Compress uploaded media

# Runs whenever media under /public changes on main — including uploads made
# through Decap CMS (which saves by committing to the repo). It compresses only
# the IMAGES that changed in the push and commits the smaller versions back.
#
# Images only: GitHub runners have no hardware video encoder, so re-encoding video
# here is far too slow. Video uploads are rare — crush those locally with
# scripts/compress-media.sh (which still handles video) before committing.
#
# No infinite loop: the commit-back uses the default GITHUB_TOKEN, and pushes
# made with that token do not trigger new workflow runs. The "[skip ci]" message
# and the head_commit guard below are extra insurance.

on:
  push:
    branches: [main]
    paths:
      - 'public/**'

# Don't re-run on our own compression commit.
jobs:
  compress:
    if: "!contains(github.event.head_commit.message, 'Auto-compress uploaded media')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (full history for diffing)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install ffmpeg + pngquant
        run: sudo apt-get update && sudo apt-get install -y ffmpeg pngquant

      - name: Find images changed in this push
        id: changed
        run: |
          git config core.quotepath false
          BEFORE='${{ github.event.before }}'
          if git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            RANGE="${BEFORE} ${GITHUB_SHA}"
          else
            RANGE="${GITHUB_SHA}~1 ${GITHUB_SHA}"
          fi
          # Only files changed in THIS push, and only images (no video on the runner).
          git diff --name-only --diff-filter=AM $RANGE -- 'public/**' \
            | grep -iE '\.(jpg|jpeg|png)$' > changed.txt || true
          echo "count=$(wc -l < changed.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "Changed images:"; cat changed.txt || true

      - name: Compress changed images
        if: steps.changed.outputs.count != '0'
        run: |
          mapfile -t FILES < changed.txt
          bash scripts/compress-media.sh "${FILES[@]}"

      - name: Commit smaller files back
        if: steps.changed.outputs.count != '0'
        run: |
          rm -f changed.txt
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Ignore permission-bit-only changes so a run that shrank nothing is a
          # true no-op (avoids the "N files changed, 0 insertions, 0 deletions" commit).
          git config core.fileMode false
          git add -A
          if git diff --cached --quiet; then
            echo "No files got smaller — nothing to commit."
            exit 0
          fi
          git commit -m "Auto-compress uploaded media [skip ci]"
          # main may have moved since checkout (e.g. another CMS save) — rebase our
          # single commit on top before pushing so the push can't be rejected.
          if ! git pull --rebase origin "$GITHUB_REF_NAME"; then
            git rebase --abort 2>/dev/null || true
            echo "Could not rebase cleanly; skipping push this run (next upload retries)."
            exit 0
          fi
          git push origin "HEAD:$GITHUB_REF_NAME"
